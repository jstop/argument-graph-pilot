# Deploys ONE commit of main to the pilot box, and only when the owner starts it:
#     gh workflow run deploy            (or Actions -> deploy -> Run workflow)
# Starting it is the approval. (Required reviewers and branch protection need GitHub Pro or a
# public repository; this repository is private on the free plan, so the gate is explicit.)
# It refuses unless the `fast` AND `live` CI jobs succeeded for exactly this commit.
# The box pulls (ops/box/deploy-poll.sh) and checks itself (ops/deploy-remote.sh); nothing here can reach it.
name: deploy
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type "deploy" to deploy the current head of main to the live pilot', required: true }

permissions: { contents: write, actions: read, checks: read }   # write: only to move the production tag
concurrency: { group: deploy-production, cancel-in-progress: false }

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: { name: production, url: "https://claims.pilot.joshautomates.com/" }
    steps:
      - name: CI, including the live stack, passed for exactly this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name=="fast" or .name=="live") | {name, conclusion}]')"
          echo "$runs"
          for job in fast live; do
            echo "$runs" | jq -e --arg j "$job" 'any(.[]; .name==$j and .conclusion=="success")' >/dev/null \
              || { echo "::error::CI job '$job' has not succeeded for $GITHUB_SHA; not deploying"; exit 1; }
          done
      - name: point the `production` tag at this commit (the box pulls; GitHub holds no credential for it)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/production -f sha="$GITHUB_SHA" >/dev/null
          echo "production -> $GITHUB_SHA"
      - name: wait until the public site says it is running this commit
        run: |
          for i in $(seq 1 60); do
            got="$(curl -sf -m 15 https://claims.pilot.joshautomates.com/healthz || true)"
            if echo "$got" | jq -e --arg c "$GITHUB_SHA" '.ok == true and .commit == $c' >/dev/null 2>&1; then echo "$got"; exit 0; fi
            sleep 15
          done
          echo "::error::after 15 minutes the site still reports: $got . The box refused or rolled back; see ~/arglog-deploy.log on the box."
          exit 1
      - run: curl -sf -m 20 https://issuer.pilot.joshautomates.com/healthz | jq -e '.ok == true'
