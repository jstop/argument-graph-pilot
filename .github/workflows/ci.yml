# fast   every push and pull request (~2 min): types, both DF-QuAD implementations against the shared
#        vectors, the verifier against the recorded real log, page scripts, secret scan.
# live   main, nightly, and on demand: Veridian's real compose stack (six witnesses + KERIA) is
#        brought up in the runner and the issuer and end-to-end suites run against it, including the
#        Python verifier reproducing every number. Nightly catches upstream drift.
# deploy main only, after both; waits in the `production` environment for the owner's approval,
#        then asks the box to deploy THIS commit. See ops/box/deploy-gate.sh for what that key can do.
name: ci
on:
  push:
  pull_request:
  schedule: [{ cron: "17 7 * * *" }]
  workflow_dispatch:

permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }          # the secret scan reads history
      - run: ./ops/secret-scan.sh --history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test -w common
      - run: node --import tsx --test issuer/test/pages.test.ts issuer/test/handle.test.ts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: verifier/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23
      - run: pip install -q -r verifier/requirements.txt
      - run: python -m pytest -q
        working-directory: verifier
      # The personal layer needs the owner's Episteme code, which is not in this repo. Its tests then
      # skip and SAY so (-rs prints the reason); they are run locally. Nothing here pretends they ran.
      - run: python -m pytest -q -rs
        working-directory: personal

  live:
    needs: fast
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: verifier/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23 jq
      - run: npm ci && pip install -q -r verifier/requirements.txt
      - name: witnesses, then KERIA (Veridian's own compose files, images pinned by digest)
        run: ./infra/stack.sh up
      - name: how KERIA (in a container) reaches the test servers on this runner
        run: |
          gw="$(docker network inspect veridian-prod_default -f '{{(index .IPAM.Config 0).Gateway}}')"
          echo "TEST_PUBLIC_HOST=$gw" >> "$GITHUB_ENV"
          echo "TEST_ISSUER_PUBLIC_URL=http://$gw:3931" >> "$GITHUB_ENV"
      - run: npm test -w issuer
      - run: npm test -w relying-party
        env: { VERIFIER_PYTHON: python }
      - if: failure()
        run: docker ps -a; docker logs --tail 80 veridian-prod-keria-1 || true

  deploy:
    needs: [fast, live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: { name: production, url: "https://claims.pilot.joshautomates.com/" }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - name: ask the box to deploy this commit
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}     # pinned; no trust-on-first-use
        run: |
          install -m 700 -d ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "ubuntu@$HOST" "$GITHUB_SHA"
      - name: the public site answers and its log still verifies the way a stranger would check it
        run: |
          curl -sf -m 20 https://claims.pilot.joshautomates.com/healthz | tee /dev/stderr | jq -e '.ok == true'
          curl -sf -m 20 https://issuer.pilot.joshautomates.com/healthz | jq -e '.ok == true'
