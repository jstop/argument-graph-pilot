name: issuemap fetch
on:
  push:
    branches: [issuemap-data]
    paths: [issuemap/requests.txt, issuemap/web.txt, .github/workflows/issuemap-fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch issue threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p issuemap/data
          grep -v '^#' issuemap/requests.txt | grep -E 'github\.com' | while read -r url; do
            path=$(echo "$url" | sed -E 's#https://github.com/([^/]+)/([^/]+)/(issues|pull)/([0-9]+).*#\1/\2/issues/\4#')
            name=$(echo "$path" | tr '/' '_')
            gh api "repos/$path" > "issuemap/data/${name}.issue.json"
            gh api --paginate "repos/$path/comments?per_page=100" | jq -s 'add' > "issuemap/data/${name}.comments.json"
            echo "$url -> $(jq length issuemap/data/${name}.comments.json) comments"
          done
      - name: Fetch web pages
        run: |
          mkdir -p issuemap/data/web
          [ -f issuemap/web.txt ] || exit 0
          i=0
          grep -v '^#' issuemap/web.txt | grep -E '^https?://' | while read -r url; do
            i=$((i+1))
            code=$(curl -sSL -A "Mozilla/5.0 issuemap" -o "issuemap/data/web/$i.html" -w '%{http_code}' "$url" || echo fail)
            echo "$i $code $url" >> issuemap/data/web/index.txt
          done
          cat issuemap/data/web/index.txt
      - name: Commit data
        run: |
          git config user.name "issuemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f issuemap/data
          git diff --cached --quiet || git commit -m "issuemap: fetched threads"
          git push
